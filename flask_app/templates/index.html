<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MeritAlloc — AI Internship Capability &amp; Allocation System (Flask)</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-[#F8FAFC] text-slate-900 min-h-screen antialiased">
    <!-- Auth Gate -->
    <div id="auth-gate" class="min-h-screen flex items-center justify-center p-4">
      <div class="w-full max-w-md bg-white border border-slate-200 rounded-xl p-6 space-y-5 shadow-sm">
        <div>
          <h1 class="text-xl font-bold tracking-tight text-slate-900">MeritAlloc</h1>
          <p class="text-xs text-slate-500 mt-1">
            AI Internship Allocation &amp; Capability Scoring (Python / Flask)
          </p>
        </div>

        <div class="grid grid-cols-2 gap-1 p-1 bg-slate-100 rounded-lg">
          <button
            type="button"
            data-auth-mode="signin"
            class="auth-mode-btn py-1.5 text-xs font-medium rounded-md bg-white text-slate-900 shadow-sm cursor-pointer"
          >
            Sign In
          </button>
          <button
            type="button"
            data-auth-mode="signup"
            class="auth-mode-btn py-1.5 text-xs font-medium rounded-md text-slate-600 cursor-pointer"
          >
            Create Account
          </button>
        </div>

        <form id="auth-form" class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Portal Role</label>
            <div class="grid grid-cols-2 gap-2">
              <button
                type="button"
                data-auth-role="student"
                class="auth-role-btn py-2 px-3 text-xs font-medium rounded-lg border border-blue-700 bg-blue-50 text-blue-800 cursor-pointer"
              >
                Student
              </button>
              <button
                type="button"
                data-auth-role="recruiter"
                class="auth-role-btn py-2 px-3 text-xs font-medium rounded-lg border border-slate-300 bg-white text-slate-700 cursor-pointer"
              >
                Recruiter
              </button>
            </div>
          </div>

          <div>
            <label for="auth-username" class="block text-xs font-medium text-slate-700 mb-1">
              Username
            </label>
            <input
              id="auth-username"
              type="text"
              required
              minlength="3"
              placeholder="e.g., ananya_cs"
              class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-600"
            />
          </div>

          <div>
            <label for="auth-password" class="block text-xs font-medium text-slate-700 mb-1">
              Password
            </label>
            <input
              id="auth-password"
              type="password"
              required
              minlength="6"
              placeholder="Minimum 6 characters"
              class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-600"
            />
          </div>

          <p
            id="auth-error"
            class="hidden text-xs text-red-700 bg-red-50 border border-red-200 rounded-lg px-3 py-2"
          ></p>

          <button
            type="submit"
            id="auth-submit-btn"
            class="w-full py-2.5 text-xs font-medium text-white bg-blue-700 rounded-lg hover:bg-blue-800 cursor-pointer"
          >
            Sign In
          </button>
        </form>
      </div>
    </div>

    <!-- Main App Shell -->
    <div id="app-shell" class="hidden min-h-screen flex">
      <!-- Sidebar -->
      <aside class="hidden md:flex md:w-[260px] md:flex-col md:fixed md:inset-y-0 bg-white border-r border-slate-200 z-30">
        <div class="h-16 px-6 flex items-center border-b border-slate-200">
          <span class="text-lg font-bold tracking-tight text-slate-900">MeritAlloc</span>
        </div>

        <div class="p-4 border-b border-slate-200 space-y-2">
          <p class="text-[11px] font-semibold text-slate-500">Workspace Role</p>
          <div class="grid grid-cols-2 gap-1 p-1 bg-slate-100 rounded-lg">
            <button
              type="button"
              id="switch-student-btn"
              class="py-1.5 text-xs font-medium rounded-md bg-white text-slate-900 shadow-sm cursor-pointer"
            >
              Student
            </button>
            <button
              type="button"
              id="switch-recruiter-btn"
              class="py-1.5 text-xs font-medium rounded-md text-slate-600 cursor-pointer"
            >
              Recruiter
            </button>
          </div>
        </div>

        <div id="sidebar-info" class="flex-1 p-4 text-xs text-slate-600 space-y-2"></div>

        <div class="p-4 border-t border-slate-200 space-y-3">
          <div class="min-w-0">
            <p id="sidebar-username" class="text-xs font-semibold text-slate-900 truncate"></p>
            <p id="sidebar-role-label" class="text-[11px] text-slate-500 truncate"></p>
          </div>
          <button
            type="button"
            id="signout-btn"
            class="w-full py-1.5 px-3 text-xs font-medium text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 cursor-pointer"
          >
            Sign Out
          </button>
        </div>
      </aside>

      <!-- Main Workspace -->
      <div class="flex-1 md:pl-[260px] flex flex-col min-w-0">
        <header class="sticky top-0 z-20 h-16 bg-white border-b border-slate-200 px-6 flex items-center justify-between gap-4">
          <div class="flex items-center gap-2 text-sm min-w-0">
            <span id="header-portal-name" class="text-slate-500 hidden sm:inline">Student Portal</span>
            <span class="text-slate-300 hidden sm:inline">/</span>
            <h2 id="header-title" class="font-semibold text-slate-900 truncate">
              Internship Capability &amp; Profile
            </h2>
          </div>

          <div class="flex items-center gap-2">
            <button
              type="button"
              id="header-action-btn"
              class="px-4 py-2 text-xs font-medium text-white bg-blue-700 rounded-lg hover:bg-blue-800 cursor-pointer whitespace-nowrap"
            >
              Refresh Capability %
            </button>
          </div>
        </header>

        <main class="flex-1 p-6 max-w-[1400px] w-full mx-auto space-y-6">
          <div
            id="api-error-banner"
            class="hidden bg-red-50 border border-red-200 rounded-lg px-4 py-3 text-xs text-red-800 flex items-center justify-between gap-4"
          >
            <span id="api-error-text"></span>
            <button type="button" id="dismiss-error-btn" class="font-semibold cursor-pointer">
              Dismiss
            </button>
          </div>

          <!-- Student Portal -->
          <div id="student-view" class="space-y-6"></div>

          <!-- Recruiter Portal -->
          <div id="recruiter-view" class="hidden space-y-6"></div>
        </main>
      </div>
    </div>

    <!-- Post Role Modal -->
    <div id="role-modal" class="hidden fixed inset-0 z-50 bg-slate-900/40 flex items-center justify-center p-4">
      <div class="bg-white border border-slate-200 rounded-xl w-full max-w-lg p-6 space-y-4">
        <div class="flex items-center justify-between border-b border-slate-200 pb-3">
          <h3 class="text-base font-semibold text-slate-900">Post Internship Role</h3>
          <button type="button" id="close-role-modal" class="text-xs text-slate-500 hover:text-slate-900 cursor-pointer">
            Close
          </button>
        </div>
        <form id="post-role-form" class="space-y-3">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1">Role Title</label>
              <input name="title" required placeholder="e.g., Backend Systems Intern" class="w-full text-sm border border-slate-300 rounded-lg px-3 py-1.5" />
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1">Company</label>
              <input name="company" required placeholder="e.g., Acme Cloud" class="w-full text-sm border border-slate-300 rounded-lg px-3 py-1.5" />
            </div>
          </div>
          <div class="grid grid-cols-3 gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1">Location</label>
              <input name="location" value="Remote" class="w-full text-sm border border-slate-300 rounded-lg px-3 py-1.5" />
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1">Stipend</label>
              <input name="stipend" value="$42/hr" class="w-full text-sm border border-slate-300 rounded-lg px-3 py-1.5" />
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1">Seats</label>
              <input name="seats" type="number" min="1" max="50" value="2" class="w-full text-sm font-mono border border-slate-300 rounded-lg px-3 py-1.5" />
            </div>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">
              Required Skills (comma-separated, e.g. Python, Flask, SQL)
            </label>
            <input name="skills" required placeholder="Python, Flask, PostgreSQL" class="w-full text-sm border border-slate-300 rounded-lg px-3 py-1.5" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Description</label>
            <textarea name="description" rows="3" required placeholder="Describe core responsibilities..." class="w-full text-sm border border-slate-300 rounded-lg px-3 py-1.5"></textarea>
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="submit" class="px-4 py-2 text-xs font-medium text-white bg-blue-700 rounded-lg hover:bg-blue-800 cursor-pointer">
              Publish Role
            </button>
          </div>
        </form>
      </div>
    </div>

    <script id="boot-data" type="application/json">
      {{ {
        "firebaseConfig": firebase_config,
        "starterInternships": starter_internships,
        "starterStudents": starter_students
      } | tojson }}
    </script>
    <script type="module" src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
